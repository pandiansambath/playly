<!DOCTYPE html>
<html>
<head><title>YT Embed Test</title></head>
<body style="background:#000; color:#fff; font-family:sans-serif; padding:20px;">

  <h2>Test 1 — Plain embed (no autoplay)</h2>
  <iframe
    width="560" height="315"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <h2 style="margin-top:40px">Test 2 — With autoplay=1</h2>
  <iframe
    width="560" height="315"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <h2 style="margin-top:40px">Test 3 — Your actual song (paste youtube_id below)</h2>
  <iframe
    width="560" height="315"
    src="https://www.youtube.com/embed/HGeFZGE2FhA?autoplay=1"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <p style="margin-top:20px; color:yellow;">
    Open browser console (F12) and check for errors here.
  </p>

</body>
</html>
