apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playly-ingress
  namespace: playly
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # Force HTTPS — cert-manager keeps the playly-tls Secret valid
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - playly.online
    - www.playly.online
    secretName: playly-tls
  rules:
  - host: playly.online
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: playly-backend-svc
            port:
              number: 80
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: playly-frontend-svc
            port:
              number: 80
  - host: www.playly.online
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: playly-backend-svc
            port:
              number: 80
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: playly-frontend-svc
            port:
              number: 80
  # Azure LB health probe catch-all (no host)
  - http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: playly-backend-svc
            port:
              number: 80
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: playly-frontend-svc
            port:
              number: 80
---
# Separate ingress for ACME challenge — NO rewrite-target.
# cert-manager edits THIS ingress (not playly-ingress) to inject the token path.
# Root cause of old failure: playly-ingress has rewrite-target:/$2 which rewrites
# the /.well-known/acme-challenge/<token> path to "/" (empty capture group),
# so the solver pod returns an empty 200 instead of the token — LE rejects it.
# Fix: ClusterIssuer points cert-manager at this ingress (name: playly-acme-solver)
# which has NO rewrite-target, so the token path passes through intact.
# NOTE: cert-manager.io/cluster-issuer annotation removed — the Certificate is now
# managed as a standalone resource (k8s/certificate.yaml), not via ingress-shim,
# so ingress-shim can no longer override the solver ingress with playly-ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playly-acme-solver
  namespace: playly
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: playly.online
    http:
      paths:
      - path: /.well-known/acme-challenge
        pathType: Prefix
        backend:
          service:
            name: playly-frontend-svc
            port:
              number: 80
  - host: www.playly.online
    http:
      paths:
      - path: /.well-known/acme-challenge
        pathType: Prefix
        backend:
          service:
            name: playly-frontend-svc
            port:
              number: 80
