apiVersion: apps/v1
kind: Deployment
metadata:
  name: playly-frontend
  namespace: playly
  labels:
    app: playly-frontend
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playly-frontend
  template:
    metadata:
      labels:
        app: playly-frontend
    spec:
      containers:
      - name: frontend
        # Image tag is auto-updated by GitHub Actions CI/CD on every push
        # ACR URL format: <acr-name>.azurecr.io/<repo>/<image>:<tag>
        image: playlyacr.azurecr.io/playly/frontend:c3a4065eb4b0fa6827c388a5f0e20e6452855e34
        ports:
        - containerPort: 3000

        # Non-sensitive config (Supabase public URL, API URL)
        envFrom:
        - configMapRef:
            name: playly-config

        # Supabase anon key from secret (NEXT_PUBLIC_* — baked at build time in CI/CD)
        env:
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: playly-secrets
              key: SUPABASE_ANON_KEY

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
